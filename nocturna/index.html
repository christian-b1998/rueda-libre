<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Rueda Nocturna</title>
</head>

<body class="bg-indigo-900 text-white">
    <section class="p-8 max-w-2xl mx-auto space-y-6">
        <p class="text-sm uppercase tracking-widest font-semibold text-amber-400">Nuevo · Jueves a sábado</p>
        <h1 class="text-5xl font-bold leading-tight">Rueda Nocturna</h1>
        <p class="text-lg text-slate-300 leading-relaxed">Descubre Medellín en bici cuando se encienden las luces</p>
        <ul class="space-y-2">
            <li class="text-2xl font-semibold">3 rutas</li>
            <li class="text-2xl font-semibold">Desde $55.000</li>
        </ul>
        <div class="flex flex-wrap gap-4">
            <a class="inline-block px-6 py-3 bg-amber-400 text-slate-900 font-semibold rounded-lg shadow-md hover:bg-amber-300 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-indigo-900"
                href="#">Inscríbete</a>
            <a class="inline-block px-6 py-3 bg-indigo-600 text-white font-semibold rounded-lg shadow-md hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-indigo-900"
                href="#">Ver rutas</a>
            <button
                class="inline-block px-6 py-3 border-2 border-amber-400 text-amber-400 font-semibold rounded-lg hover:bg-amber-400 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-indigo-900"
                type="button">Más información</button>
        </div>
    </section>
</body>

</html>
